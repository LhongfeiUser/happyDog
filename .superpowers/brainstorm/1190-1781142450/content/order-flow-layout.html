<h2>订单流程页面布局</h2>
<p class="subtitle">下单、支付、订单详情</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>分步向导</h3>
      <p>顶部步骤指示器，分步骤填写信息，清晰引导用户完成下单</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>单页表单</h3>
      <p>所有信息在一页展示，分区填写，适合信息量不大的情况</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>抽屉式</h3>
      <p>点击服务后弹出侧边抽屉，填写信息，不离开当前页面</p>
    </div>
  </div>
</div>

<div class="mockup">
  <div class="mockup-header">预览：下单流程</div>
  <div class="mockup-body">
    <div style="padding: 20px;">
      <!-- 步骤指示器 -->
      <div style="display: flex; justify-content: center; margin-bottom: 30px;">
        <div style="display: flex; align-items: center;">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: #FF6B35; color: white; display: flex; align-items: center; justify-content: center;">1</div>
          <div style="width: 80px; height: 3px; background: #FF6B35;"></div>
          <div style="width: 40px; height: 40px; border-radius: 50%; background: #FF6B35; color: white; display: flex; align-items: center; justify-content: center;">2</div>
          <div style="width: 80px; height: 3px; background: #eee;"></div>
          <div style="width: 40px; height: 40px; border-radius: 50%; background: #eee; color: #999; display: flex; align-items: center; justify-content: center;">3</div>
          <div style="width: 80px; height: 3px; background: #eee;"></div>
          <div style="width: 40px; height: 40px; border-radius: 50%; background: #eee; color: #999; display: flex; align-items: center; justify-content: center;">4</div>
        </div>
      </div>
      <div style="text-align: center; margin-bottom: 20px;">
        <span style="color: #FF6B35;">选择服务</span> → <span>选择宠物</span> → <span>选择时间</span> → <span>确认下单</span>
      </div>

      <!-- 内容区域 -->
      <div style="background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h3>选择服务</h3>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px;">
          <div style="border: 2px solid #FF6B35; border-radius: 12px; padding: 16px; text-align: center;">
            <div style="font-size: 32px;">🧼</div>
            <div style="font-weight: bold; margin-top: 8px;">基础洗护</div>
            <div style="color: #FF6B35; margin-top: 4px;">¥68</div>
          </div>
          <div style="border: 2px solid #eee; border-radius: 12px; padding: 16px; text-align: center;">
            <div style="font-size: 32px;">✨</div>
            <div style="font-weight: bold; margin-top: 8px;">精致洗护</div>
            <div style="color: #FF6B35; margin-top: 4px;">¥128</div>
          </div>
          <div style="border: 2px solid #eee; border-radius: 12px; padding: 16px; text-align: center;">
            <div style="font-size: 32px;">🛁</div>
            <div style="font-weight: bold; margin-top: 8px;">SPA护理</div>
            <div style="color: #FF6B35; margin-top: 4px;">¥198</div>
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <button class="mock-button" style="background: #FF6B35; color: white; padding: 12px 48px; border-radius: 24px; font-size: 16px;">下一步</button>
      </div>
    </div>
  </div>
</div>
