<h2>服务列表页布局</h2>
<p class="subtitle">展示洗护、美容、寄养等服务</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>卡片网格</h3>
      <p>左侧分类筛选 + 右侧服务卡片网格展示，支持排序和筛选</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>列表+详情</h3>
      <p>左侧服务列表 + 右侧服务详情预览，点击切换</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>瀑布流</h3>
      <p>顶部筛选栏 + 瀑布流卡片展示，视觉效果丰富</p>
    </div>
  </div>
</div>

<div class="mockup">
  <div class="mockup-header">预览：服务列表结构</div>
  <div class="mockup-body">
    <div style="display: flex; height: 400px;">
      <div class="mock-sidebar" style="width: 200px; border-radius: 12px 0 0 12px;">
        <div style="padding: 16px;">
          <h4>服务分类</h4>
          <div style="margin: 8px 0; padding: 8px; background: #fff3e0; border-radius: 8px;">🧼 洗护</div>
          <div style="margin: 8px 0; padding: 8px;">✂️ 美容</div>
          <div style="margin: 8px 0; padding: 8px;">🏠 寄养</div>
          <h4 style="margin-top: 16px;">价格区间</h4>
          <div style="margin: 8px 0; padding: 8px;">0-100元</div>
          <div style="margin: 8px 0; padding: 8px;">100-300元</div>
          <div style="margin: 8px 0; padding: 8px;">300元以上</div>
        </div>
      </div>
      <div class="mock-content" style="flex: 1; padding: 16px; border-radius: 0 12px 12px 0;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
          <div class="mock-input" style="width: 300px;">搜索服务...</div>
          <div>综合排序 ▼</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
          <div class="placeholder" style="height: 180px; border-radius: 12px;">服务卡片</div>
        </div>
      </div>
    </div>
  </div>
</div>
