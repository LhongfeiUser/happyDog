<h2>首页布局设计</h2>
<p class="subtitle">活泼可爱风格，圆角、卡通元素、暖色调</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>经典布局</h3>
      <p>顶部导航 + 轮播图 + 服务分类卡片 + 热门服务列表 + 底部信息</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>现代布局</h3>
      <p>侧边导航 + 全屏轮播 + 瀑布流服务展示 + 浮动客服按钮</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>卡片式布局</h3>
      <p>顶部导航 + 服务分类图标网格 + 推荐服务卡片 + 用户评价轮播</p>
    </div>
  </div>
</div>

      </div>
      <h3>热门服务</h3>
