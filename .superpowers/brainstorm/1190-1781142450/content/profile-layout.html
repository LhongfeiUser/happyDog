<h2>个人中心页面布局</h2>
<p class="subtitle">用户信息、宠物档案、订单管理</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>侧边导航</h3>
      <p>左侧菜单导航，右侧内容区域，功能分区清晰</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>卡片网格</h3>
      <p>顶部用户信息，下方功能卡片网格，直观易用</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>标签页切换</h3>
      <p>顶部用户信息，下方标签页切换不同功能区域</p>
    </div>
  </div>
</div>

          <div style="font-weight: bold; margin-top: 12px;">宠物爱好者</div>
          <div style="color: #666; font-size: 14px;">138****8888</div>

        <div style="margin-bottom: 8px; padding: 12px;">🐾 我的宠物</div>

              <span style="background: #E8F5E9; padding: 4px 8px; border-radius: 4px; font-size: 12px;">已绝育</span>
              <span style="background: #E3F2FD; padding: 4px 8px; border-radius: 4px; font-size: 12px;">已疫苗</span>

          <!-- 宠物卡片2 -->
          <div style="border: 2px solid #eee; border-radius: 12px; padding: 16px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 60px; height: 60px; border-radius: 50%; background: #FFF3E0; display: flex; align-items: center; justify-content: center; font-size: 24px;">🐱</div>
              <div>
                <div style="font-weight: bold;">咪咪</div>
                <div style="color: #666;">英国短毛猫 · 2岁</div>

            <div style="margin-top: 12px; display: flex; gap: 8px;">

              <span style="background: #E3F2FD; padding: 4px 8px; border-radius: 4px; font-size: 12px;">已疫苗</span>

        <!-- 添加宠物按钮 -->
        <div style="margin-top: 16px; border: 2px dashed #FF6B35; border-radius: 12px; padding: 24px; text-align: center; color: #FF6B35; cursor: pointer;">
