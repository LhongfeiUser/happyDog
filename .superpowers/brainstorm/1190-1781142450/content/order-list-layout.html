<h2>订单列表页布局</h2>
<p class="subtitle">查看和管理订单</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>标签页分类</h3>
      <p>顶部标签页（全部/待支付/进行中/已完成），下方订单卡片列表</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>时间轴样式</h3>
      <p>按时间倒序展示，左侧时间轴，右侧订单卡片</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>卡片堆叠</h3>
      <p>订单卡片堆叠展示，支持展开查看详情</p>
    </div>
  </div>
</div>

<div class="mockup">
  <div class="mockup-header">预览：订单列表</div>
  <div class="mockup-body">
    <div style="padding: 20px;">
      <!-- 标签页 -->
      <div style="display: flex; gap: 24px; margin-bottom: 24px; border-bottom: 2px solid #eee; padding-bottom: 12px;">
        <div style="color: #FF6B35; font-weight: bold; border-bottom: 2px solid #FF6B35; padding-bottom: 12px;">全部</div>
        <div>待支付</div>
        <div>进行中</div>
        <div>已完成</div>
      </div>

      <!-- 订单卡片 -->
      <div style="background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div style="font-weight: bold;">订单号：PET20240115001</div>
          <div style="color: #FF6B35; background: #FFF3E0; padding: 4px 12px; border-radius: 12px;">待支付</div>
        </div>
        <div style="display: flex; gap: 16px; align-items: center;">
          <div style="width: 80px; height: 80px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center;">🧼</div>
          <div style="flex: 1;">
            <div style="font-weight: bold;">基础洗护服务</div>
            <div style="color: #666; margin-top: 4px;">宠物：旺财（金毛）</div>
            <div style="color: #666; margin-top: 4px;">预约时间：2024-01-16 14:00</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 20px; font-weight: bold; color: #FF6B35;">¥68</div>
            <button class="mock-button" style="margin-top: 8px; background: #FF6B35; color: white; padding: 8px 16px; border-radius: 16px;">去支付</button>
          </div>
        </div>
      </div>

      <div style="background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div style="font-weight: bold;">订单号：PET20240114002</div>
          <div style="color: #4CAF50; background: #E8F5E9; padding: 4px 12px; border-radius: 12px;">已完成</div>
        </div>
        <div style="display: flex; gap: 16px; align-items: center;">
          <div style="width: 80px; height: 80px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center;">✂️</div>
          <div style="flex: 1;">
            <div style="font-weight: bold;">精致美容服务</div>
            <div style="color: #666; margin-top: 4px;">宠物：咪咪（英短）</div>
            <div style="color: #666; margin-top: 4px;">完成时间：2024-01-14 16:30</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 20px; font-weight: bold; color: #FF6B35;">¥158</div>
            <button class="mock-button" style="margin-top: 8px; background: #4CAF50; color: white; padding: 8px 16px; border-radius: 16px;">去评价</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
